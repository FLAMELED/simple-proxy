name: Bolsillo Advance

# Builds and tests bolsillo-advance/: engine checks, Play bundle (AAB, API 36) and an end-to-end run on an
# Android emulator. Nothing is published. The upload key comes from secrets when they exist; otherwise a
# throw-away test key is generated and the bundle must NOT be uploaded to Play.
on:
  push:
    paths:
      - 'bolsillo-advance/**'
      - '.github/workflows/bolsillo-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  engine:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test ROMs (pinned commits, not redistributed)
        run: bolsillo-advance/audit/fetch.sh bolsillo-advance/audit/testroms.lock testroms
      - name: Engine checks
        run: |
          mkdir -p out
          TESTROMS=$PWD/testroms node bolsillo-advance/app/gba/test/verify.js --out out/verify | tee out/verify.txt
      - name: Browser checks (Chromium)
        run: |
          node bolsillo-advance/app/gba/build.js
          mkdir -p /tmp/pw && cd /tmp/pw && npm init -y >/dev/null && npm i playwright@1.49.1 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          cd "$GITHUB_WORKSPACE"
          NODE_PATH=/tmp/pw/node_modules node bolsillo-advance/app/gba/test/ui-notices.js bolsillo-advance/app/gba/dist/www testroms/PL/LCD/BG/BGMode7/BGMode7.gba out | tee out/ui-notices.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: engine-results
          path: |
            out/verify.txt
            out/verify/results.json
            out/ui-notices.txt

  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.14.3
      - name: Upload key (secrets) or throw-away test key
        env:
          KS_B64: ${{ secrets.BOLSILLO_UPLOAD_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.BOLSILLO_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.BOLSILLO_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.BOLSILLO_KEY_PASSWORD }}
        run: |
          if [ -n "$KS_B64" ]; then
            echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            { echo "BOLSILLO_KEYSTORE_PASSWORD=$KS_PASS"; echo "BOLSILLO_KEY_ALIAS=$KEY_ALIAS"; echo "BOLSILLO_KEY_PASSWORD=$KEY_PASS"; echo "KEY_KIND=upload"; } >> "$GITHUB_ENV"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/upload.jks" -storetype PKCS12 -storepass testkey -keypass testkey \
              -alias test -keyalg RSA -keysize 2048 -validity 30 -dname "CN=Bolsillo Advance CI test key - do not upload"
            { echo "BOLSILLO_KEYSTORE_PASSWORD=testkey"; echo "BOLSILLO_KEY_ALIAS=test"; echo "BOLSILLO_KEY_PASSWORD=testkey"; echo "KEY_KIND=test"; } >> "$GITHUB_ENV"
          fi
          echo "BOLSILLO_KEYSTORE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build AAB (bundleRelease)
        run: gradle -p bolsillo-advance/android --no-daemon bundleRelease
      - name: Universal APK from the bundle (bundletool)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.18.1/bundletool-all-1.18.1.jar
          mkdir -p out
          cp bolsillo-advance/android/app/build/outputs/bundle/release/app-release.aab out/bolsillo-advance.aab
          java -jar "$RUNNER_TEMP/bundletool.jar" build-apks --bundle out/bolsillo-advance.aab --output "$RUNNER_TEMP/app.apks" --mode universal \
            --ks "$BOLSILLO_KEYSTORE" --ks-pass "pass:$BOLSILLO_KEYSTORE_PASSWORD" --ks-key-alias "$BOLSILLO_KEY_ALIAS" --key-pass "pass:$BOLSILLO_KEY_PASSWORD"
          unzip -p "$RUNNER_TEMP/app.apks" universal.apk > out/bolsillo-advance-universal.apk
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs out/bolsillo-advance-universal.apk | tee out/apksigner.txt
          echo "signed with: $KEY_KIND key" | tee out/key-kind.txt
      - name: Bundle checks
        run: python3 bolsillo-advance/android/tests/check_bundle.py out/bolsillo-advance.aab out/bolsillo-advance-universal.apk "$RUNNER_TEMP/bundletool.jar" --release | tee out/check-bundle.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-bundle
          path: out/

  device:
    needs: bundle
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        api: [36]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: android-bundle
          path: bundle
      - name: Test ROMs and expected save
        run: |
          bolsillo-advance/audit/fetch.sh bolsillo-advance/audit/testroms.lock testroms
          mkdir -p roms
          cp testroms/PL/LCD/BG/BGMode7/BGMode7.gba testroms/PL/Sound/PCM/Stereo/SoundPCMStereo.gba testroms/gba-tests/save/sram.gba roms/
          node bolsillo-advance/android/tests/expected_sav.js roms/sram.gba roms/sram-expected.sav
          pip install --quiet pillow
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emulator run
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -no-boot-anim -camera-back none
          script: python3 bolsillo-advance/android/tests/device_test.py bundle/bolsillo-advance-universal.apk roms roms/sram-expected.sav out/device-${{ matrix.api }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: device-${{ matrix.api }}
          path: out/
